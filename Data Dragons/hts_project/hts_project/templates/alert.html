<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

<div class="container" style="margin-top:40px">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div id="latestCard" class="card text-white bg-danger mb-3" style="display:none">
                <div class="card-header">🚨 Latest Suspicious Alert</div>
                <div class="card-body">
                    <h5 id="alertType" class="card-title">--</h5>
                    <p id="alertDetails" class="card-text">--</p>
                    <p id="alertTs" class="card-text small">--</p>
                    <button id="ackBtn" class="btn btn-light">Acknowledge</button>
                    <a href="/" class="btn btn-dark">Back</a>
                </div>
            </div>

            <div id="noAlert" class="card bg-primary text-white">
                <div class="card-body">
                    <h5 class="card-title">No active suspicious alerts</h5>
                    <p class="card-text">System is clear right now. Latest alerts are stored in history.</p>
                    <a href="/" class="btn btn-dark">Back</a>
                </div>
            </div>

            <div style="margin-top:16px">
                <h5>Recent Alerts</h5>
                <ul id="recentList" class="list-group"></ul>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<script>
    async function fetchAlerts(){
        try{
            const res = await fetch('/alerts');
            if(!res.ok) return;
            const list = await res.json();
            const recent = document.getElementById('recentList');
            recent.innerHTML = '';
            if(list.length>0){
                // show latest
                const latest = list[0];
                document.getElementById('alertType').innerText = latest.type || 'Unknown';
                document.getElementById('alertDetails').innerText = JSON.stringify(latest.details || {});
                document.getElementById('alertTs').innerText = latest.ts || '';
                document.getElementById('latestCard').style.display = 'block';
                document.getElementById('noAlert').style.display = 'none';
            } else {
                document.getElementById('latestCard').style.display = 'none';
                document.getElementById('noAlert').style.display = 'block';
            }

            // recent list
            for(const a of list.slice(0,10)){
                const li = document.createElement('li');
                li.className = 'list-group-item';
                li.innerText = (a.ts?('['+a.ts+'] '):'') + (a.type||'') + ' - ' + JSON.stringify(a.details||{});
                recent.appendChild(li);
            }
        }catch(e){ console.warn(e); }
    }

    document.getElementById('ackBtn').addEventListener('click', async ()=>{
        await fetch('/clear_alert', {method:'POST'});
        await fetchAlerts();
    });

    fetchAlerts();
    setInterval(fetchAlerts, 2000);
</script>

</body>
